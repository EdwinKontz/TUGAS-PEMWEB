<!DOCTYPE html>
<html lang="en">
<head>
    <title>Profile</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #fff;
            text-align: center;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #23a6d5, #7b4397);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        
        .kartu {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        h2 {
            margin: 30px 0 15px;
            font-size: 1.5rem;
            color: #ffd166;
        }

        p {
            margin: 10px 0;
            line-height: 1.6;
        }

    
        .animation {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .character {
            width: 400px;
            height: auto;
            margin-bottom: -75px;
            position: relative;
            z-index: 2;
        }

        #image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            position: relative;
            z-index: 1;
        }

        mark {
            background: #ffd166;
            color: #222;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 999px;
            transition: background 0.2s, transform 0.2s;
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="kartu">
        <h1>Profil Mahasiswa</h1>

        <div class="animation">
            <video class="character" autoplay muted loop playsinline>
                <source src="website-animatiion-final.webm" type="video/webm">
            </video>
            <img id="image" src="download.jpg" alt="Foto Profil">
        </div>

        <h2>Data Diri</h2>
        <p>Nama saya <b>Rio Ricky Febryan</b>. Saya adalah seorang mahasiswa Sistem Informasi (S1).</p>
        <p>Saya sedang mempelajari <b>HTML</b>, CSS dan JavaScript.</p>
        <p>Target saya adalah sebagai <mark>Game Developer</mark>.</p>

        <a class="button" href="about-me.html">Tentang Saya</a>
    </div>
</body>
</html>
