<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" href="jadwal.css">
</head>
<body>
    <nav class="menu">
        <a href="index.html">Profile</a>
        <a href="tentang.html">Tentang Saya</a>
        <a href="education.html">Education</a>
        <a href="course-schedule.html">Jadwal Kuliah</a>
        <a href="Hobbies.html">Hobbies</a>
        <a href="form.html" class="aktif">Form</a>
        <a href="table1.html">Tabel 1</a>
        <a href="table2.html">Table 2</a>
        <a href="table3.html">Table 3</a>
        <a href="assets/js/latihan-js.html">Latihan JS</a>
    </nav>

    <main class="kartu">
        <h1>Formulir Pendaftaran</h1>

        <form class="form">
            <div class="field">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap">
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password">
            </div>

            <div class="field">
                <label for="umur">Umur</label>
                <input type="number" id="umur" name="umur" placeholder="Masukkan umur">
            </div>

            <div class="field">
                <label for="lahir">Tanggal Lahir</label>
                <input type="date" id="lahir" name="lahir">
            </div>

            <div class="field">
                <span class="judul">Jenis Kelamin</span>
                <div class="pilihan">
                    <label><input type="radio" name="gender" value="L"> Laki-laki</label>
                    <label><input type="radio" name="gender" value="P"> Perempuan</label>
                </div>
            </div>

            <div class="field">
                <span class="judul">Hobi</span>
                <div class="pilihan">
                    <label><input type="checkbox" name="hobi" value="coding"> Coding</label>
                    <label><input type="checkbox" name="hobi" value="gaming"> Gaming</label>
                    <label><input type="checkbox" name="hobi" value="photografi"> Photografi</label>
                </div>
            </div>

            <div class="field">
                <label for="jurusan">Jurusan</label>
                <select id="jurusan" name="jurusan">
                    <option>Teknik Informatika</option>
                    <!-- tambahkan option jurusan lain sesuai kodemu -->
                </select>
            </div>

            <div class="field">
                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat" rows="4" placeholder="Masukkan alamat lengkap"></textarea>
            </div>

            <div class="field">
                <label for="foto">Upload Foto</label>
                <input type="file" id="foto" name="foto">
            </div>

            <div class="field">
                <label for="website">Website</label>
                <input type="url" id="website" name="website" placeholder="https://www.example.com">
            </div>

            <div class="aksi">
                <button type="submit" class="tombol">Kirim</button>
                <button type="reset" class="tombol sekunder">Reset</button>
            </div>
        </form>

       
    </main>
</body>
</html>
